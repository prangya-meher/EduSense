          <div class="nav-item">
            <a href="#" class="nav-link">
              <i class="fas fa-chart-line"></i>

            </a>

          <div class="nav-item">

          <div class="nav-item">
            <a href="#" class="nav-link">
              <i class="fas fa-user"></i>

            </a>
          </div>
          <div class="nav-item">
            <a href="#" class="nav-link">
              <i class="fas fa-cog"></i>

            </a>

            <a href="http://127.0.0.1:8000/admin/" class="nav-link">
              <i class="fas fa-user-shield"></i>
              <span>Admin</span>
            </a>
          </div>
        </nav>
        <div class="logout-section" id="logout-btn">
          <a onclick="handleLogout()" class="nav-link">
            <i class="fas fa-sign-out-alt"></i>

          </a>

      <!-- Main Content -->
      <main class="main-content">
        <header>
          <div class="header-left">
            <div class="hamburger" id="dashboard-hamburger">
              <i class="fas fa-bars"></i>
            </div>
          </div>
          <div class="header-right">
            <div class="icon-btn">
              <i class="far fa-bell"></i>
              <div class="notification-dot"></div>
            </div>
            <div class="user-profile">
              <div class="user-avatar" id="profile-initials"></div>
              <span class="user-name" id="user-name-header"></span>
            </div>
          </div>
        </header>

        <section class="welcome-row">
          <div class="welcome-text">
            <h1 id="welcome-title">Welcome back! 👋</h1>
            <p>Keep learning, keep growing.</p>
          </div>
          <div class="level-card">
            <div class="level-icon"><i class="fas fa-medal"></i></div>
            <div class="level-info">
              <span>Your Level</span>
              <!-- <strong>Intermediate</strong> -->
            </div>
          </div>
        </section>

        <section class="stats-grid">
          <div class="stat-card">
            <div class="stat-header">
              <div class="stat-icon purple"><i class="fas fa-book"></i></div>
              <span class="stat-title">Quizzes Taken</span>
            </div>
            <!-- <div class="stat-value">24</div> -->
            <div class="stat-footer">Keep it up!</div>
          </div>
          <div class="stat-card">
            <div class="stat-header">
              <div class="stat-icon green">
                <i class="fas fa-check-circle"></i>
              </div>
              <span class="stat-title">Average Score</span>
            </div>
            <!-- <div class="stat-value">72%</div> -->
            <div class="stat-footer">Good job!</div>
          </div>
          <div class="stat-card">
            <div class="stat-header">
              <div class="stat-icon blue">
                <i class="fas fa-chart-line"></i>
              </div>
              <span class="stat-title">Strengths</span>
            </div>
            <!-- <div class="stat-value">5</div> -->
            <div class="stat-footer">Topics</div>
          </div>
          <div class="stat-card">
            <div class="stat-header">
              <div class="stat-icon red">
                <i class="fas fa-exclamation-triangle"></i>
              </div>
              <span class="stat-title">Areas Of Improvement</span>
            </div>
            <!-- <div class="stat-value">3</div> -->
            <div class="stat-footer">Focus more</div>
          </div>
        </section>

        <section class="bottom-grid">
          <!-- Weak Areas -->
          <div class="section-card">
            <div class="section-header">
              <div class="section-title">
                <i class="fas fa-star"></i>
                <span>Area Of Improvement</span>
              </div>
              <a href="#" class="view-all">View all</a>
            </div>

                            <div class="topic-info">
                                <h4>Normalization</h4>

                                </div>

                        <div class="topic-item">

                                </div>
                            </div>
                        </div>
                    </div> -->

          <!-- Recommended -->
          <div class="section-card">
            <div class="section-header">
              <div class="section-title">

              <a href="#" class="view-all">View all</a>
            </div>
