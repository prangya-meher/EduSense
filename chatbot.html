<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Assistant</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
    --primary:#701a75;
    --primary-light:#a21caf;
    --secondary:#6366f1;
    --accent:#fdf4ff;
    --text-dark:#1e1b4b;
    --text-muted:#475569;
    --surface:#ffffff;
    --border:#e9d5ff;
    --soft-shadow:0 18px 45px rgba(112,26,117,.10);
}

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

html,
body{
    width:100%;
    height:100%;
    overflow-x: hidden;
    /* overflow:hidden; */
}

/* =========================
   BODY
========================= */

body{
    background:
        radial-gradient(circle at top left, rgba(253,244,255,.95), transparent 34%),
        linear-gradient(135deg,#ffffff 0%,#f8fafc 48%,#fdf4ff 100%);
    color:var(--text-dark);
    position:relative;
}

/* =========================
   BACKGROUND EFFECTS
========================= */

.bg-circle{
    position:absolute;
    border-radius:50%;
    z-index:0;
    filter:blur(10px);
}

.bg1{
    width:350px;
    height:350px;
    background:rgba(112,26,117,.08);
    top:-120px;
    left:-120px;
    animation:move1 10s infinite alternate ease-in-out;
}

.bg2{
    width:250px;
    height:250px;
    background:rgba(99,102,241,.08);
    bottom:-80px;
    right:-80px;
    animation:move2 12s infinite alternate ease-in-out;
}

.bg3{
    width:120px;
    height:120px;
    background:rgba(162,28,175,.07);
    top:100px;
    right:160px;
    animation:move3 8s infinite alternate ease-in-out;
}

@keyframes move1{
    from{
        transform:translate(0,0);
    }
    to{
        transform:translate(30px,20px);
    }
}

@keyframes move2{
    from{
        transform:translate(0,0);
    }
    to{
        transform:translate(-25px,-15px);
    }
}

@keyframes move3{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(20px);
    }
}

/* =========================
   MAIN CONTAINER
========================= */

.container{
    width:100%;
    height:100vh;
    padding:18px 32px 20px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    position:relative;
    z-index:2;
}

/* =========================
   TOP BAR
========================= */

.top-bar{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

/* LEFT */

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brand img{
    width:52px;
    height:52px;
    border-radius:50%;
    object-fit:cover;
    background:var(--surface);
    padding:4px;
    border:1px solid rgba(112,26,117,.10);
    box-shadow:0 8px 20px rgba(112,26,117,.08);
    transition:.3s ease;
}

.brand img:hover{
    transform:translateY(-4px) scale(1.05);
}

.brand-text h2{
    font-size:18px;
    font-weight:700;
    color:var(--text-dark);
}

.status{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:2px;
    font-size:11px;
    color:var(--text-muted);
}

.status-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#0f766e;
    animation:pulse 1.5s infinite;
}

@keyframes pulse{

    0%{
        transform:scale(1);
        opacity:1;
    }

    50%{
        transform:scale(1.6);
        opacity:.5;
    }

    100%{
        transform:scale(1);
        opacity:1;
    }

}

/* =========================
   HERO SECTION
========================= */

.hero{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    margin-top:10px;
}

/* =========================
   ROBOT
========================= */

.robot-wrapper{
    position:relative;
    perspective:2000px;
}

.robot{
    width:clamp(190px,22vw,260px);
    height:clamp(190px,22vw,260px);
    max-width:100%;
    object-fit:contain;
    filter:drop-shadow(0 18px 30px rgba(112,26,117,.16));
    animation:float 3s ease-in-out infinite;
    transition:transform .15s linear;
    
}

/* FLOAT */

@keyframes float{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-10px);
    }

    100%{
        transform:translateY(0px);
    }

}

/* =========================
   SPEECH
========================= */

.speech{
    position:absolute;
    top:8px;
    right:-12px;
    background:var(--primary);
    color:#fff;
    padding:8px 14px;
    border-radius:18px;
    font-size:12px;
    font-weight:500;
    box-shadow:0 8px 20px rgba(112,26,117,.22);
    animation:bounce 2s infinite;
}

@keyframes bounce{

    0%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-6px);
    }

    100%{
        transform:translateY(0);
    }

}

/* =========================
   TITLE
========================= */

.title{
    margin-top:8px;
    animation:fadeUp 1s ease;
}

.title h1{
    font-size:40px;
    font-weight:700;
    color:var(--text-dark);
    margin-bottom:8px;
}

.title p{
    font-size:14px;
    color:var(--text-muted);
    line-height:1.6;
    max-width:620px;
}

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* =========================
   QUICK OPTIONS
========================= */

.quick-options{
    width:100%;
    max-width:900px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    margin-top:22px;
}

.option-card{
    padding:14px 16px;
    border-radius:20px;
    display:flex;
    align-items:center;
    gap:10px;
    font-size:13px;
    font-weight:600;
    color:var(--text-dark);
    border:1px solid rgba(112,26,117,.10);
    box-shadow:0 8px 20px rgba(15,23,42,.04);
    transition:.3s ease;
    animation:cardPop .7s ease;
}

.option-card:hover{
    transform:translateY(-5px) scale(1.03);
    box-shadow:0 14px 30px rgba(112,26,117,.10);
    border-color:rgba(112,26,117,.22);
}

.option-icon{
    font-size:18px;
}

@keyframes cardPop{

    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* COLORS */

.purple{
    background:#fdf4ff;
}

.blue{
    background:#eef2ff;
}

.green{
    background:#ecfdf5;
}

/* =========================
   SEARCH BAR
========================= */

.search-area{
    width:100%;
    display:flex;
    justify-content:center;
    margin-top:18px;
}

.search-bar{
    width:100%;
    max-width:900px;
    background:rgba(255,255,255,.92);
    border-radius:60px;
    padding:8px;
    display:flex;
    align-items:center;
    gap:10px;
    border:1px solid var(--border);
    box-shadow:var(--soft-shadow);
    transition:.3s ease;
}

.search-bar:hover{
    transform:translateY(-2px);
    box-shadow:0 18px 48px rgba(112,26,117,.14);
}

/* LEFT ICON */

.chat-icon{
    width:48px;
    height:48px;
    border-radius:50%;
    background:var(--primary);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:18px;
    flex-shrink:0;
    animation:glow 2s infinite;
}

@keyframes glow{

    0%{
        box-shadow:0 0 0 rgba(112,26,117,0);
    }

    50%{
        box-shadow:0 0 18px rgba(112,26,117,.24);
    }

    100%{
        box-shadow:0 0 0 rgba(112,26,117,0);
    }

}

/* INPUT */

.search-bar input{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    font-size:14px;
    color:var(--text-dark);
}

.search-bar input::placeholder{
    color:#94a3b8;
}

/* SEND BUTTON */

.send-btn{
    width:46px;
    height:46px;
    border:none;
    border-radius:50%;
    background:#fdf4ff;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--primary);
    font-size:18px;
    cursor:pointer;
    flex-shrink:0;
    transition:.3s ease;
}

.send-btn:hover{
    transform:scale(1.1) rotate(-10deg);
    background:var(--primary);
    color:#fff;
}

/* =========================
   MOBILE RESPONSIVE
========================= */

@media(max-width:768px){

    html,
    body{
        overflow-y:auto;
    }

    .container{
        min-height:100vh;
        height:auto;
        padding:16px 16px 100px;
    }

    .hero{
        margin-top:10px;
    }

    .robot{
        width:170px;
        height:170px;
    }

    .title h1{
        font-size:28px;
    }

    .title p{
        font-size:13px;
    }

    .quick-options{
        grid-template-columns:1fr;
        gap:10px;
        margin-top:18px;
    }

    .option-card{
        font-size:13px;
    }

    /* STICKY SEARCH BAR */

    .search-area{
        position:fixed;
        left:0;
        bottom:0;
        width:100%;
        padding:12px 14px 16px;
        margin-top:0;
        background:linear-gradient(to top,#fdf4ff 70%,transparent);
        backdrop-filter:blur(10px);
        z-index:100;
    }

    .search-bar{
        max-width:100%;
    }

}

</style>
</head>

<body>

<!-- BACKGROUND -->

<div class="bg-circle bg1"></div>
<div class="bg-circle bg2"></div>
<div class="bg-circle bg3"></div>

<!-- MAIN -->

<div class="container">

    <!-- TOP BAR -->

    <header class="top-bar">

        <!-- LEFT -->

        <div class="brand">

            <img src="assets/images/chatbot_logo.jpg" alt="Logo">

            <div class="brand-text">

                <h2>Student Assistant</h2>

                <div class="status">

                    <div class="status-dot"></div>

                    Online

                </div>

            </div>

        </div>

    </header>

    <!-- HERO -->

    <main class="hero">

        <!-- ROBOT -->

        <div class="robot-wrapper">

            <img src="assets/images/robo.png" class="robot" alt="Robot">

            <div class="speech">
                Hey! 👋
            </div>

        </div>

        <!-- TITLE -->

        <div class="title">

            <h1>How can I help you?</h1>

            <p>
                Ask anything related to studies, coding,
                assignments, projects or guidance.
            </p>

        </div>

        <!-- OPTIONS -->

        <div class="quick-options">

            <div class="option-card purple">

                <div class="option-icon">✨</div>

                Need help with a concept?

            </div>

            <div class="option-card blue">

                <div class="option-icon">📘</div>

                Want explanations or examples?

            </div>

            <div class="option-card green">

                <div class="option-icon">💡</div>

                Ask anything below ✨

            </div>

        </div>

    </main>

    <!-- SEARCH BAR -->

    <div class="search-area">

        <div class="search-bar">

            <div class="chat-icon">
                💬
            </div>

            <input
                type="text"
                placeholder="Message Student Assistant..."
            >

            <button class="send-btn">
                ➤
            </button>

        </div>

    </div>

</div>

<script>

/* =========================
   ROBOT FOLLOW CURSOR
========================= */

const robot = document.querySelector(".robot");

document.addEventListener("mousemove",(e)=>{

    const x = (window.innerWidth / 2 - e.pageX) / 40;
    const y = (window.innerHeight / 2 - e.pageY) / 40;

    robot.style.transform =
        `translateY(-5px) rotateY(${x}deg) rotateX(${-y}deg)`;

});

/* =========================
   BUTTON LIGHT EFFECT
========================= */

const buttons = document.querySelectorAll(
    ".send-btn,.option-card"
);

buttons.forEach((btn)=>{

    btn.addEventListener("mousemove",(e)=>{

        const rect = btn.getBoundingClientRect();

        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        btn.style.background =
            `radial-gradient(circle at ${x}px ${y}px,
            rgba(255,255,255,.8),
            rgba(255,255,255,.1))`;

    });

    btn.addEventListener("mouseleave",()=>{

        btn.style.background = "";

    });

});

</script>

</body>
</html>
