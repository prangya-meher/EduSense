<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EduSense</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-sidebar">
            <div class="auth-brand">
                <div class="brand-logo">EduSense</div>
                <div class="brand-tagline">Study Online, Learn Online</div>
            </div>
            <div class="sidebar-content">
                <h1>Welcome Back! Please login to continue your journey.</h1>
            </div>
            <img src="https://images.unsplash.com/photo-1543269865-cbf427effbad?q=80&w=1000&auto=format&fit=crop" alt="Education Illustration" class="sidebar-image">
        </div>
        <div class="auth-form-container">
            <div id="alert-container" style="margin-bottom: 15px;"></div>
            
            <div class="form-header">
                <h2>Login</h2>
                <p>Welcome back! Please enter your details.</p>
            </div>
            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <span class="toggle-password">👁️</span>
                </div>
                <div class="form-options">
                    <div class="checkbox-group">
                        <input type="checkbox" id="remember">
                        <label for="remember">Remember me</label>
                    </div>
                    <!-- <a href="#" class="forgot-password">Forgot Password?</a> -->
                </div>
                <button type="submit" id="btn-login" class="btn-auth">Login</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="register.html">Sign up for free</a>
            </div>
        </div>
    </div>
    <script type="module" src="login.js"></script>
</body>
</html>
